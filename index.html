<!DOCTYPE html>
<html lang="es">

<head>

</head>

<body>
    <form action="http://193.147.87.202/procesaform.php" method="POST" enctype="multipart/form-data">
        <fieldset>
            <legend>Datos de acceso e identificación</legend>

            <label for="campo-usuario">Nombre de usuario:</label>
            <input type="text" id="campo-usuario" name="usuario" value="usuario_defecto"><br><br>

            <label for="campo-clave">Contraseña:</label>
            <input type="password" id="campo-clave" name="clave" value="ClaveSegura123"><br><br>

            
        </fieldset>
        <fieldset>
            <legend>Opciones de selección</legend>
            <p>Nivel de experiencia:</p>
            <input type="radio" id="exp-principiante" name="nivel" value="principiante">
            <label for="exp-principante">Principiante</label>
            <br>
            <input type="radio" id="exp-intermedio" name="nivel" value="intermedio">
            <label for="exp-intermedio">Intermedio</label>
            <br>
            <input type="radio" id="exp-avanzado" name="nivel" value="avanzado">
            <label for="exp-avanzado">Avanzado</label>
            <input type="hidden" name="token_formulario" value="abc123xyz">

            <hr>

            <p>Áreas de interés</p>
            <input type="checkbox" id="interes-frontend" name="intereses[]" value="frontend">
            <label for="interes-frontend">Desarrollo Frontend</label>
            <br>
            <input type="checkbox" id="interes-backend" name="intereses[]" value="backend">
            <label for="interes-backend">Desarrollo Backend</label>
            <br>
            <input type="checkbox" id="interes-diseño" name="intereses[]" value="diseño">
            <label for="interes-diseño">Diseño de Interfaces</label>
        </fieldset>

        <fieldset>
            <legend>Selección de listas desplegables</legend>

            <label for="curso-academico">Curso académico:</label>
            <select id="curso-academico" name="curso">
                <option value="1">Primer Curso</option>
                <option value="2">Segundo Curso</option>
                <option value="3" selected>Tercer Curso</option>
                <option value="4">Cuarto Curso</option>
            </select>

            <br><br>

            <label for="asignaturas-matricula">Asignaturas a matricular(Ctrl+Click para seleccionar varias)</label>
            <br>
            <select id="asignaturas-matricula" name="asignaturas[]" multiple size="5">
                <option value="iu" selected>Interfaces de Usuario</option>
                <option value="bdii">Bases de Datos II</option>
                <option value="rcii">Redes de Computadoras II</option>
                <option value="lc">Lógica para Computadoras</option>
                <option value="cda">Centros de Datos</option>
            </select>


        </fieldset>
        <fieldset>
            <legend>Datos específicos, ficheros y comentarios</legend>
            <label for="campo-edad">Edad:</label>
            <input type="number" id="campo-edad" name="edad" min="18" max="99" value="20">
            <br>

            <label for="campo-correo">Correo institucional:</label>
            <input type="email" id="campo-correo" name="correo" value="alumno@esei.uvigo.es">
            <br>

            <label for="campo-fecha">Fecha de entrega:</label>
            <input type="date" id="campo-fecha" name="fecha-entrega" value="2026-09-10">
            <br>

            <label for="campo-observaciones">Observaciones adicionales:</label><br>
            <textarea id="campo-observaciones" name="observaciones" rows="4" cols="40">Comentarios iniciales cargados por defecto en el formulario.</textarea>
            <br>

            <label for="campo-archivos">Adjuntar documentación (soporta selección múltiple):</label><br>
            <input type="file" id="campo-archivos" name="documentos[]" multiple>
        </fieldset>

        <fieldset>
            <legend>Acciones</legend>
            <input type="reset" value="Restablecer valores por defecto">

            <input type="submit" value="Enviar formulario">
        </fieldset>

    </form>
</body>
</html>
